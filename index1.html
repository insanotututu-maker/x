<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copa Torneo Valorant</title>
    <!-- Bootstrap CDN (CSS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

    <!-- Contenedor principal centrado -->
    <div class="container my-5 text-center">
        <div class="p-5 border rounded-3 bg-white shadow-sm">
            
            <!-- 1. Etiqueta (badge bg-danger) -->
            <span class="badge bg-danger text-uppercase mb-3 px-3 py-2">
                GRAN FINAL 2026
            </span>

            <!-- 2. Título (display-3, text-uppercase, fw-bold) con color amarillo/dorado -->
            <h1 class="display-3 text-uppercase fw-bold text-warning mb-3">
                COPA TORNEO VALORANT
            </h1>

            <!-- 3. Párrafo destacado (lead, fst-italic) -->
            <p class="lead fst-italic text-secondary mb-4">
                Transmisión en vivo este sábado a las 20:00 hrs.
            </p>

            <!-- Botón de acción (VER TRANSMISIÓN) -->
            <button type="button" class="btn btn-outline-secondary text-uppercase px-4 py-2">
                VER TRANSMISIÓN
            </button>

        </div>
    </div>

    <!-- Bootstrap CDN (JS) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
